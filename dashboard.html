<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · Plus Alpha</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#0a0a0a}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px clamp(20px,5vw,64px) 64px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:110px}
.brand-logo{height:52px;width:auto;display:block}
.logout{border:0;background:none;font:inherit;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#999;cursor:pointer}
.logout:hover{color:#111}
.head{padding-bottom:28px;border-bottom:1px solid #111}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#999;margin-bottom:14px}
h1{font-size:40px;line-height:1;margin:0;letter-spacing:-.04em}
.meta{font-size:11px;color:#999;margin-top:12px}
.list{margin-top:0}
.report{display:grid;grid-template-columns:1.05fr 1.45fr auto;gap:30px;align-items:center;padding:24px 0;border-bottom:1px solid #e2e2e2}
.name{font-size:18px;font-weight:650;letter-spacing:-.02em}
.info{font-size:11px;color:#777;line-height:1.65}
.actions{display:flex;align-items:center;gap:9px}
.btn{appearance:none;border:1px solid #d9d9d9;background:#fff;color:#333;text-decoration:none;font:inherit;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#111;color:#111}
.btn.primary{border-color:#111;color:#111}
.copy-status{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;font-size:10px;padding:10px 13px;opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none}
.copy-status.show{opacity:1;transform:translateY(0)}
.foot{margin-top:70px;font-size:9px;color:#aaa;letter-spacing:.04em}
.empty{padding:26px 0;color:#999;font-size:12px;border-bottom:1px solid #e2e2e2}
@media(max-width:760px){
  .top{margin-bottom:72px}
  .report{grid-template-columns:1fr;gap:10px}
  .actions{margin-top:4px}
  h1{font-size:34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="brand-logo" src="/pa_logo.svg" alt="Plus Alpha Agency">
    <form method="post" action="/api/logout"><button class="logout" type="submit">Sign out</button></form>
  </header>

  <section class="head">
    <div class="eyebrow">Internal Library</div>
    <h1>Reports</h1>
    <div class="meta">All active Plus Alpha reports</div>
  </section>

  <main class="list" id="report-list"></main>

  <footer class="foot">INTERNAL · plusalpha.agency</footer>
</div>

<div class="copy-status" id="copy-status">CLIENT LINK COPIED</div>

<script>
// Add future reports here only. Client links remain directly accessible without login.
const REPORTS = [
  {
    talent: "lullaboy",
    description: "PR / Media · Jul — Aug 2026",
    updated: "Updated Aug 19, 2026",
    path: "/lullaboy-pr-aug2026"
  }
];

const list = document.getElementById("report-list");

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
  }[c]));
}

if (!REPORTS.length) {
  list.innerHTML = '<div class="empty">No reports yet.</div>';
} else {
  list.innerHTML = REPORTS.map((r, i) => `
    <div class="report">
      <div class="name">${esc(r.talent)}</div>
      <div class="info">${esc(r.description)}<br>${esc(r.updated)}</div>
      <div class="actions">
        <a class="btn primary" href="${esc(r.path)}" target="_blank" rel="noopener">Open</a>
        <button class="btn copy" type="button" data-path="${esc(r.path)}">Copy client link</button>
      </div>
    </div>
  `).join("");
}

document.querySelectorAll(".copy").forEach(btn => {
  btn.addEventListener("click", async () => {
    const url = location.origin + btn.dataset.path;
    try {
      await navigator.clipboard.writeText(url);
      const status = document.getElementById("copy-status");
      status.classList.add("show");
      setTimeout(() => status.classList.remove("show"), 1300);
    } catch {
      window.prompt("Copy this client link:", url);
    }
  });
});
</script>
</body>
</html>
