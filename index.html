<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plus Alpha Reports</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#0a0a0a}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;display:flex;flex-direction:column;padding:28px clamp(20px,5vw,64px)}
.top{display:flex;justify-content:space-between;align-items:center}
.brand-logo{height:52px;width:auto;display:block}
.private{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#888;border:1px solid #d8d8d8;padding:5px 8px}
.center{flex:1;display:flex;align-items:center;justify-content:center}
.box{width:min(100%,420px);padding:42px 0}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#999;margin-bottom:16px}
h1{font-size:32px;letter-spacing:-.035em;line-height:1.05;margin:0 0 12px;font-weight:700}
.desc{font-size:12px;line-height:1.65;color:#777;margin:0 0 34px}
label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid #111}
input{border:0;outline:0;padding:13px 0;font:inherit;font-size:14px;background:transparent;min-width:0}
button{border:0;background:transparent;padding:13px 0 13px 22px;font:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;cursor:pointer}
button:hover{opacity:.55}
.error{font-size:11px;color:#555;margin-top:12px;display:none}
.footer{font-size:9px;color:#aaa;letter-spacing:.04em}
@media(max-width:600px){.page{padding:20px}.box{padding:28px 0}h1{font-size:28px}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <img class="brand-logo" src="/pa_logo.svg" alt="Plus Alpha Agency">
    <div class="private">Internal</div>
  </header>

  <main class="center">
    <section class="box">
      <div class="eyebrow">Internal Access</div>
      <h1>Reports</h1>
      <p class="desc">Plus Alpha internal report library.<br>Enter the team password to continue.</p>

      <form method="post" action="/api/login" autocomplete="off">
        <label for="password">Password</label>
        <div class="row">
          <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
          <button type="submit">ENTER →</button>
        </div>
        <div class="error" id="error">Incorrect password. Please try again.</div>
      </form>
    </section>
  </main>

  <footer class="footer">PLUS ALPHA AGENCY · INTERNAL</footer>
</div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("error") === "1") {
  document.getElementById("error").style.display = "block";
}
</script>
</body>
</html>
